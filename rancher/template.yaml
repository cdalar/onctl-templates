# Template manifest. Schema: .github/scripts/manifest.py
description: Rancher management (local) cluster on single-node k3s with cert-manager.
tags: [rancher, kubernetes, k3s, management]
entrypoint: rancher-local.sh
env:
  - name: RANCHER_HOSTNAME
    description: "Default: rancher.<public-ip-with-dashes>.sslip.io."
  - name: RANCHER_VERSION
    description: "Rancher chart version (default: latest)."
  - name: RANCHER_REPLICAS
    description: "Default: 1."
  - name: BOOTSTRAP_PASSWORD
    description: "First admin password (default: random, saved to /root/rancher-bootstrap-password)."
  - name: CERT_MANAGER_VERSION
    description: "cert-manager chart version (default: latest)."
  - name: K3S_VERSION
    description: "e.g. v1.35.4+k3s1 (default: k3s stable channel)."
