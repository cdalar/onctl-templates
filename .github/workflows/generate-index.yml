name: Generate Index YAML

# index.yaml is kept in sync inside each PR, so it lands on main together with
# the template change and main never needs a bot commit:
#   - PR from a branch in this repo: regenerate and commit index.yaml to the PR
#     branch, then re-dispatch this workflow so the new head commit gets a check
#     (pushes made with GITHUB_TOKEN don't trigger workflow runs).
#   - PR from a fork: the token is read-only, so fail with instructions.
#   - push to main / manual run: verify only; fail if index.yaml is stale.

on:
  # No path filter on PRs: this is a required check, and a path-filtered
  # required check never reports on PRs that don't match, blocking them.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - '*/**.sh'
      - '*/**.yaml'
      - '*/**.yml'
      - '*/**.config'
      - '*/**.toml'
      - '*/**.json'
      - '**/README.md'
      - 'index.yaml'
      - '.github/workflows/generate-index.yml'
      - '.github/scripts/*.py'
  workflow_dispatch:

permissions: {}

concurrency:
  group: generate-index-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: index.yaml up to date
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit index.yaml to same-repo PR branches
      actions: write    # re-dispatch this workflow on the new commit

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Install dependencies
      run: python3 -m pip install --user pyyaml

    - name: Generate index.yaml
      run: python3 .github/scripts/generate_index.py

    - name: Validate index.yaml
      run: python3 .github/scripts/validate_index.py

    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet index.yaml; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "index.yaml is up to date"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff index.yaml
        fi

    - name: Commit index.yaml to PR branch
      if: >-
        steps.changes.outputs.changed == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.head_ref }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index.yaml
        git commit -m "Regenerate index.yaml"
        git push origin "HEAD:$BRANCH"
        gh workflow run generate-index.yml --ref "$BRANCH"
        echo "::notice::Committed regenerated index.yaml to $BRANCH"

    - name: Fail if index.yaml is stale
      if: >-
        steps.changes.outputs.changed == 'true' &&
        !(github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      run: |
        echo "::error::index.yaml is out of date. Run 'python3 .github/scripts/generate_index.py' and commit the result."
        exit 1
